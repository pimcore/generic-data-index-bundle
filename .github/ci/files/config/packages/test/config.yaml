imports:
    - { resource: ../../config.yaml }

# this cache is used during tests when setting up pimcore
framework:
    profiler:
        enabled: true
        collect: false
    cache:
        pools:
            pimcore.cache.pool:
                public: true
                tags: true
                default_lifetime: 31536000  # 1 year
                adapter: cache.adapter.array


doctrine:
    dbal:
        connections:
            default:
                url: '%pimcore_test.db.dsn%'
                host: ~
                port: ~
                dbname: ~
                user: ~
                password: ~
                mapping_types:
#                    enum: string
                    bit: boolean

parameters:
    secret: ThisTokenIsNotSoSecretChangeIt
    pimcore_test.db.dsn: '%env(PIMCORE_TEST_DB_DSN)%'
    env(PIMCORE_TEST_DB_DSN): ~
    pimcore.encryption.secret: '%env(PIMCORE_ENCRYPTION_SECRET)%'
    
pimcore_open_search_client:
    clients:
        default:
            hosts: ['%env(PIMCORE_OPEN_SEARCH_HOST)%']

pimcore_elasticsearch_client:
    es_clients:
        default:
            hosts: ['%env(PIMCORE_ELASTIC_SEARCH_HOST)%']
            logger_channel: 'pimcore.elasticsearch'
            ssl_verification: false

pimcore:
    product_registration:
        instance_identifier: '%env(PIMCORE_INSTANCE_IDENTIFIER)%'
        product_key: '%env(PIMCORE_PRODUCT_KEY)%'
    assets:
        metadata:
            predefined:
                definitions:
                    test-input:
                        name: 'testInput'
                        type: input
                    test-textarea:
                        name: 'testTextarea'
                        type: textarea
                    test-select:
                        name: 'testSelect'
                        type: select
                        config: value1,value2
                    test-asset:
                        name: 'testAsset'
                        type: asset
                    test-document:
                        name: 'testDocument'
                        type: document
                    test-object:
                        name: 'testObject'
                        type: object
                    test-date:
                        name: 'testDate'
                        type: date
                    test-checkbox:
                        name: 'testCheckbox'
                        type: checkbox
    workflows:
        # Used by WorkflowPlacesIndexingTest: places stored in element_workflow_state. Only elements whose key starts
        # with "gdi-wf-" are part of it, so the initial place is not written for elements of other tests.
        gdi_test_state_table:
            label: 'GDI test workflow (state table)'
            type: 'workflow'
            marking_store:
                type: 'state_table'
            support_strategy:
                type: 'expression'
                arguments:
                    - ['Pimcore\Model\DataObject\Concrete', 'Pimcore\Model\Asset', 'Pimcore\Model\Document\Page']
                    - 'subject.getKey() matches "/^gdi-wf-/"'
            places:
                gdi_wf_draft:
                    label: 'Draft'
                gdi_wf_edit_text:
                    label: 'Edit text'
                gdi_wf_edit_images:
                    label: 'Edit images'
                gdi_wf_done:
                    label: 'Done'
            transitions:
                gdi_wf_start_editing:
                    from: 'gdi_wf_draft'
                    to: ['gdi_wf_edit_text', 'gdi_wf_edit_images']
                    options:
                        label: 'Start editing'
                gdi_wf_finish_directly:
                    from: 'gdi_wf_draft'
                    to: 'gdi_wf_done'
                    options:
                        label: 'Finish'
            globalActions:
                gdi_wf_reset:
                    label: 'Reset'
                    to: ['gdi_wf_draft']
