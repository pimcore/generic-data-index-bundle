imports:
    - { resource: ../../config.yaml }

# this cache is used during tests when setting up pimcore
framework:
    profiler:
        enabled: true
        collect: false
    cache:
        pools:
            pimcore.cache.pool:
                public: true
                tags: true
                default_lifetime: 31536000  # 1 year
                adapter: cache.adapter.array


doctrine:
    dbal:
        connections:
            default:
                url: '%pimcore_test.db.dsn%'
                host: ~
                port: ~
                dbname: ~
                user: ~
                password: ~
                mapping_types:
#                    enum: string
                    bit: boolean

parameters:
    secret: ThisTokenIsNotSoSecretChangeIt
    pimcore_test.db.dsn: '%env(PIMCORE_TEST_DB_DSN)%'
    env(PIMCORE_TEST_DB_DSN): ~
    pimcore.encryption.secret: '%env(PIMCORE_ENCRYPTION_SECRET)%'
    
pimcore_open_search_client:
    clients:
        default:
            hosts: ['%env(PIMCORE_OPEN_SEARCH_HOST)%']

pimcore_elasticsearch_client:
    es_clients:
        default:
            hosts: ['%env(PIMCORE_ELASTIC_SEARCH_HOST)%']
            logger_channel: 'pimcore.elasticsearch'
            ssl_verification: false

pimcore:
    product_registration:
        instance_identifier: '%env(PIMCORE_INSTANCE_IDENTIFIER)%'
        product_key: '%env(PIMCORE_PRODUCT_KEY)%'
    assets:
        metadata:
            predefined:
                definitions:
                    test-input:
                        name: 'testInput'
                        type: input
                    test-textarea:
                        name: 'testTextarea'
                        type: textarea
                    test-select:
                        name: 'testSelect'
                        type: select
                        config: value1,value2
                    test-asset:
                        name: 'testAsset'
                        type: asset
                    test-document:
                        name: 'testDocument'
                        type: document
                    test-object:
                        name: 'testObject'
                        type: object
                    test-date:
                        name: 'testDate'
                        type: date
                    test-checkbox:
                        name: 'testCheckbox'
                        type: checkbox
